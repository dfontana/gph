[package]
name = "gph"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "A Kitty-native Mermaid previewer and SVG exporter"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gph"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
fs2 = "0.4"
merman = { version = "=0.8.0-alpha.3", default-features = false, features = ["core-full", "core-host", "raster"] }
notify = "8.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
tower-lsp-server = { version = "0.23", default-features = false, features = ["runtime-tokio"] }
winnow = "1.0.4"
